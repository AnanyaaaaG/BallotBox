<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BallotBox Admin Dashboard</title>
    <link rel="stylesheet" href="Dashboard.css">
    <style>
        body {
            text-align: center;
        }
        header {
            text-align: left;
            height: 60px;
        }
        header h1 {
            font-size: 1.5em;
            margin-left: 10px;
        }
        .logo {
            height: 40px;
        }
        main {
            padding-top: 70px;
        }
        button {
            background-color: #007BFF; /* Blue background */
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s ease; /* Smooth transition for hover effect */
        }
        button:hover {
            background-color: #0056b3; /* Darker blue on hover */
        }
        footer {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
            background-color: #f1f1f1;
            color: black;
            text-align: center;
            padding: 10px 0;
        }
        #upcoming-elections {
            max-width: 600px;
            margin: 0 auto;
            text-align: center; /* Center align the election list */
        }
        .election-button {
            display: block;
            width: 100%;
            margin-bottom: 10px;
            text-align: left;
            padding: 15px;
            background-color: #007BFF; /* Blue background for election buttons */
            border: none;
            color: white;
            border-radius: 5px;
            transition: background-color 0.3s ease; /* Smooth transition for hover effect */
        }
        .election-button:hover {
            background-color: #0056b3; /* Darker blue on hover */
        }
        .election-button span {
            display: block;
            font-size: 0.8em;
            color: #ddd;
        }
    </style>
</head>
<body>
    <header>
        <img src="img/BallotBoxLogo.jpeg" alt="Ballot Box Logo" class="logo">
        <h1>Admin Dashboard</h1>
        <button id="logoutBtn">Logout</button>
    </header>

    <main>
        <section id="upcoming-elections">
            <h2>Upcoming Elections</h2>
            <div id="electionsList">
                <!-- Hardcoded elections for demonstration -->
                <button class="election-button" onclick="window.location.href='AdminElectionDetails.html?id=1'">
                    City Council Election 2023
                    <span>Date: 2023-11-15</span>
                    <span>Type: Local</span>
                    <span>Constituency: Downtown</span>
                </button>
                <button class="election-button" onclick="window.location.href='AdminElectionDetails.html?id=2'">
                    State Governor Election 2024
                    <span>Date: 2024-03-10</span>
                    <span>Type: State</span>
                    <span>Constituency: Statewide</span>
                </button>
                <button class="election-button" onclick="window.location.href='AdminElectionDetails.html?id=3'">
                    Federal Parliament Election 2024
                    <span>Date: 2024-05-20</span>
                    <span>Type: Federal</span>
                    <span>Constituency: National</span>
                </button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 BallotBox. All rights reserved.</p>
    </footer>

    <script>
        // Event listener for logout button
        document.getElementById('logoutBtn').addEventListener('click', () => {
            // Implement logout functionality
            window.location.href = 'LoginPage.html';
        });
    </script>
</body>
</html>
